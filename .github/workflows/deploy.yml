# Espelho no GitHub Pages — só manual (Actions → Deploy → Run workflow).
# Não roda mais em push: a main é produção e o espelho parou de ser atualizado.
# Se rodar, o build sai sempre noindex (ver ESPELHO em src/data/site.ts).
name: Deploy

on:
  workflow_dispatch:

# Um deploy por vez; não cancela o que está no meio para não publicar pela metade.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # O Pages de projeto serve em /<repo>/. Sem isso, todo caminho de
      # public/ aponta para a raiz do domínio e volta 404.
      - name: Build
        run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
